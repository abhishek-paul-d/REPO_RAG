[project]
name = "repo-rag"
version = "0.1.0"
description = "Code-aware RAG assistant for GitHub repositories (AST chunking, commit-history bug matching)"
readme = "README.md"
authors = [
    { name = "abhishek-paul-d", email = "paulabhishek393@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.162.0",
    "gitpython>=3.2.1",
    "langchain-chroma>=1.1.0",
    "langchain-core>=1.6.13",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.19",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "sentence-transformers>=5.7.0",
    "streamlit>=1.66.1",
    "transformers>=4.51,<5",
    "tree-sitter>=0.26.0",
    "tree-sitter-language-pack>=1.22.1",
    "typer>=0.27.3",
    "uvicorn>=0.54.0",
]

[project.scripts]
repo-rag = "repo_rag.cli:app"

[build-system]
requires = ["uv_build>=0.11.33,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "astchunk>=0.1.0",
    "httpx>=0.28.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not network'"
markers = ["network: talks to GitHub; run with `pytest -m network`"]
filterwarnings = [
    # Chroma's own notice when it reads a collection's configuration (modify(), .configuration).
    "ignore:legacy embedding function config:DeprecationWarning",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
# Generated from eval/embedding_bench/bench.py by build_notebook.py.
extend-exclude = [
    "eval/embedding_bench/*.ipynb",
    "notebooks/*.ipynb",  # generated by notebooks/build_colab_indexer.py
    "tests/fixtures",  # chunker inputs: deliberately odd code that must stay byte-for-byte
]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Benchmark data tables (long question strings) and notebook-style scripts.
"eval/**" = ["E501"]

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["repo_rag", "eval.retrieval"]
modules = ["eval.build_qa_datasets", "eval.run_retrieval_eval", "eval.build_followup_datasets", "eval.run_followup_eval", "eval.summarize_followup", "eval.build_ambiguous_dataset", "eval.run_ambiguous_eval", "eval.build_comparison_dataset", "eval.summarize_comparison", "eval.build_expansion_dataset", "eval.run_expansion_eval", "eval.analyze_expansion_run", "eval.prepare_bugfix_eval", "eval.refreeze_bugfix_v2", "eval.run_bugfix_eval", "eval.run_commit_depth_eval", "eval.analyze_commit_depth", "eval.analyze_bugfix_run", "eval.export_bugfix_index", "eval.check_phase5_code_regression", "eval.report_bugfix_baseline", "eval.prepare_answer_bakeoff", "eval.prepare_answer_bakeoff_v2", "eval.prepare_answer_bakeoff_v3", "eval.prepare_answer_bakeoff_v4", "eval.prepare_answer_bakeoff_v5", "eval.build_v5_targets", "eval.build_v5_questions", "eval.build_v4_fresh_facts", "eval.build_dev_extra_facts", "eval.answer_bakeoff_io", "eval.answer_bakeoff_backend", "eval.answer_bakeoff_scoring", "eval.run_answer_bakeoff", "eval.analyze_answer_bakeoff", "eval.prepare_answer_bakeoff_capsule"]
# Legacy standalone research scripts/notebook sources are outside the maintained type-check scope.
exclude = ['^eval/embedding_bench/', '^eval/chunker_check\.py$']
ignore_missing_imports = true
warn_unused_ignores = true
